# Builds swpt.exe, the zip and the MSI installer when a version tag (v1.2.3) is pushed,
# and publishes them as a GitHub release with the notes from CHANGELOG.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check that the tag matches version.py
        shell: pwsh
        run: |
          $v = (Select-String version.py -Pattern 'VERSION = "(.+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match version.py ($v)" }
          "VERSION=$v" >> $env:GITHUB_ENV

      - name: Install build tools
        run: |
          pip install -r requirements.txt pyinstaller
          dotnet tool install --global wix --version 5.0.2

      - name: Build exe, zip and MSI
        shell: pwsh
        run: ./build.ps1 -Out dist

      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $lines = Get-Content CHANGELOG.md
          $start = [array]::IndexOf($lines, ($lines | Where-Object { $_ -match "^## \[$env:VERSION\]" } | Select-Object -First 1))
          if ($start -lt 0) { throw "No CHANGELOG.md section for $env:VERSION" }
          $notes = $lines[($start + 1)..($lines.Count - 1)]
          $end = [array]::IndexOf($notes, ($notes | Where-Object { $_ -match '^## ' } | Select-Object -First 1))
          if ($end -ge 0) { $notes = $notes[0..($end - 1)] }
          $notes | Set-Content notes.md -Encoding utf8

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} dist/*.msi dist/swpt-windows-x64.zip --title "swpt ${{ env.VERSION }}" --notes-file notes.md
